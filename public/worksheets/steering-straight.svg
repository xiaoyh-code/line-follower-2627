 <title id="chart-title">Simulated heading on the return straight</title>
 <desc id="chart-description">From 0 to 0.87 m. The solid blue line uses P = 2, D = 1.5, span 3.18 degrees with no alternating crossings. The dashed red line uses P = 4, D = 0.01, span 12.71 degrees with 21 alternating crossings of plus and minus one degree.</desc>
 <metadata>
  <rdf:RDF xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#">
   <cc:Work>
    <dc:type rdf:resource="http://purl.org/dc/dcmitype/StillImage"/>
    <dc:title>Simulated heading on the return straight</dc:title>
    <dc:description>Both runs use a base command of 7, I = 0, a 15 mm left starting offset and a 40 ms simulated command delay. Distance s begins at x = −0.45 m. The solid blue line uses P = 2, D = 1.5, heading span 3.18°. The dashed red line uses P = 4, D = 0.01, span 12.71°.</dc:description>
